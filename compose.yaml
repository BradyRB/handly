services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: handly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: handly
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - handly-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handly -d handly"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://handly:${POSTGRES_PASSWORD}@db:5432/handly?schema=public
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      target: runtime
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY:-}
    environment:
      DATABASE_URL: postgresql://handly:${POSTGRES_PASSWORD}@db:5432/handly?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET}
      PAYMENT_ADAPTER: ${PAYMENT_ADAPTER:-development}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  handly-db:
